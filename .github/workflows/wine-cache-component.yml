# SPDX-License-Identifier: LGPL-2.1-or-later
name: Bounded Wine compiler-cache component measurement
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/wine-cache-component.yml'
      - 'tools/import_host_compiler_cache.py'
      - 'tools/benchmark_wine_cache_component.py'
      - 'tests/test_import_host_compiler_cache.py'
      - 'tests/test_wine_cache_component.py'
      - 'Makefile'
permissions:
  contents: read
concurrency:
  group: wine-cache-component-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install only reader dependency
        run: 'python -m pip install --only-binary=:all: PyYAML==6.0.1'
      - name: Test actual importer, deadline and measurement helpers
        run: |
          python3 tests/test_import_host_compiler_cache.py
          python3 tests/test_wine_cache_component.py
          python3 tests/test_test_reachability.py
  component:
    needs: contracts
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'measure-wine-cache-component') &&
          !contains(github.event.pull_request.labels.*.name, 'build-windows-child-fixture') }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      LLVM_CONFIG: /usr/bin/llvm-config-18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install only reader dependency
        run: 'python -m pip install --only-binary=:all: PyYAML==6.0.1'
      - name: Preserve original host cache environment
        run: |
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/fixture-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/fixture-cache"
      - name: Measure one real Wine object under one bounded deadline
        run: python3 tools/benchmark_wine_cache_component.py --seconds 900
      - name: Retain small component evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wine-cache-component-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wine-cache-component/*.json
            ${{ runner.temp }}/wine-cache-component/*.log
            ${{ runner.temp }}/wine-cache-component/*.txt
            ${{ runner.temp }}/wine-cache-component/import/IMPORT-RECEIPT.json
            ${{ runner.temp }}/fixture-evidence/ccache-host/*.json
            ${{ runner.temp }}/fixture-evidence/ccache-host/*-stats.txt
            ${{ runner.temp }}/wine-host/configure.log
            ${{ runner.temp }}/wine-host/tools.log
          retention-days: 7
          if-no-files-found: warn
