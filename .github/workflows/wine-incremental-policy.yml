# SPDX-License-Identifier: LGPL-2.1-or-later
name: Incremental Wine policy and synthetic DAG
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/wine_incremental_source.py'
      - 'tools/wine_reuse_decision.py'
      - 'tests/test_wine_incremental_source.py'
      - 'tests/test_wine_build_performance.py'
      - 'tests/test_reuse_host_wine.py'
      - 'tests/test_network_workflow.py'
      - 'tests/test_user_workflow_join.py'
      - 'tests/test_wine_child_integration.py'
      - 'tests/test_wine_compile_cache.py'
      - 'tools/reuse_host_wine.py'
      - '.github/workflows/wine-incremental-policy.yml'
      - '.github/workflows/windows-child-fixture.yml'
permissions:
  contents: read
jobs:
  policy-and-dag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install workflow parser
        run: python3 -m pip install pyyaml==6.0.1
      - name: Read pinned Wine dependency-generator contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: wine-mirror/wine
          ref: 490f6d5dcbb2a5047345b8af88d114bbcaad69a8
          path: .deps/policy-wine
          persist-credentials: false
          sparse-checkout: |
            tools/makedep.c
            configure.ac
          sparse-checkout-cone-mode: false
      - name: Test existing workflow and mocked host reuse contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PROSPERO_WINE_SOURCE: ${{ github.workspace }}/.deps/policy-wine
        run: |
          python3 tests/test_wine_build_performance.py
          python3 tests/test_reuse_host_wine.py
          python3 tests/test_network_workflow.py
          python3 tests/test_user_workflow_join.py
          python3 tests/test_wine_compile_cache.py CacheContracts
          python3 tests/test_wine_child_integration.py \
            WineChildIntegration.test_resource_probe_caps_jobs_and_preserves_environment \
            WineChildIntegration.test_actual_target_compile_gate_precedes_full_host \
            WineChildIntegration.test_fixture_provenance_preflight_runs_before_first_consumption \
            WineChildIntegration.test_workflow_job_environment_contexts \
            WineChildIntegration.test_runner_paths_execute_before_consumers
      - name: Test policy and compile the small owned DAG
        env:
          PROSPERO_WINE_SOURCE: ${{ github.workspace }}/.deps/policy-wine
          PW_INCREMENTAL_REPORT: ${{ runner.temp }}/synthetic-incremental.json
          PW_ADMISSION_REPORT: ${{ runner.temp }}/mock-host-admission.json
        run: python3 tests/test_wine_incremental_source.py
      - name: Repeat DAG under the exact outer sanitizer Make overrides
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PROSPERO_WINE_SOURCE: ${{ github.workspace }}/.deps/policy-wine
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          printf 'all:\n\tpython3 tests/test_wine_incremental_source.py\n' > "$RUNNER_TEMP/incremental-harness.mk"
          make -f "$RUNNER_TEMP/incremental-harness.mk" BUILD=build/sanitize CC=clang \
            CFLAGS='-O1 -g -std=c11 -Wall -Wextra -Werror -fno-omit-frame-pointer -fsanitize=address,undefined'
      - name: Retain synthetic counts and mocked early receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wine-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/synthetic-incremental.json
            ${{ runner.temp }}/mock-host-admission.json
          if-no-files-found: error
          retention-days: 7
