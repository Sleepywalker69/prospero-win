# SPDX-License-Identifier: LGPL-2.1-or-later
name: Source D3D12 frontend and original query link check
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - .github/workflows/d3d12-frontend.yml
      - tools/build_d3d12_frontend.py
      - tools/check_d3d12_frontend.py
      - tools/inspect_graphics_pe.py
      - tests/test_d3d12_frontend.py
      - tests/test_d3d12_query.py
      - tests/fixtures/d3d12_capability_query.c
      - tests/fixtures/d3d12_query_contract.h
      - tests/fixtures/d3d12_query_contract_test.c
      - docs/D3D12_FRONTEND_CI.md
      - docs/D3D12_QUERY.md
      - Makefile
      - PUBLICATION_ALLOWLIST.txt
permissions:
  contents: read
concurrency:
  group: d3d12-frontend-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  LC_ALL: C
  TZ: UTC
  SOURCE_DATE_EPOCH: '1000000000'
jobs:
  d3d12-frontend:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           contains(github.event.pull_request.labels.*.name, 'build-d3d12-frontend')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install official cross-build prerequisites and run host controls
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git meson ninja-build \
            glslang-tools gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix \
            mingw-w64-tools binutils-mingw-w64-x86-64
          python3 -m pip install pyyaml==6.0.1
          python3 tests/test_d3d12_query.py -v
          python3 tests/test_d3d12_frontend.py -v
          make audit check-whitespace
      - name: Fetch exact public source and retain complete source and notices
        timeout-minutes: 15
        run: |
          python3 tools/build_d3d12_frontend.py sources --work "$RUNNER_TEMP/d3d12" \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          tar -czf "$RUNNER_TEMP/d3d12-source-checkpoint.tar.gz" -C "$RUNNER_TEMP/d3d12" \
            sources SOURCE-CHECKPOINT.json logs
      - name: Retain source checkpoint before compilation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d3d12-source-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/d3d12-source-checkpoint.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Build matching frontend DLLs and link and inspect the original query
        timeout-minutes: 35
        run: |
          python3 tools/build_d3d12_frontend.py build --work "$RUNNER_TEMP/d3d12"
          tar -czf "$RUNNER_TEMP/d3d12-link-checked.tar.gz" -C "$RUNNER_TEMP/d3d12" \
            app sources SOURCE-CHECKPOINT.json COMMANDS.json PE-LINK-REPORT.json logs
      - name: Retain link-checked candidate with corresponding source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d3d12-link-checked-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/d3d12-link-checked.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Retain partial original outputs and evidence on every outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d3d12-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/d3d12/sources/
            ${{ runner.temp }}/d3d12/logs/
            ${{ runner.temp }}/d3d12/SOURCE-CHECKPOINT.json
            ${{ runner.temp }}/d3d12/COMMANDS.json
            ${{ runner.temp }}/d3d12/PE-LINK-REPORT.json
            ${{ runner.temp }}/d3d12/app/
            ${{ runner.temp }}/d3d12/install/x64/*.dll
            ${{ runner.temp }}/d3d12/build/libs/d3d12/d3d12.dll
            ${{ runner.temp }}/d3d12/build/libs/d3d12core/d3d12core.dll
            ${{ runner.temp }}/d3d12/build/meson-logs/
            ${{ runner.temp }}/d3d12/build/meson-info/
          if-no-files-found: warn
          retention-days: 7
