# SPDX-License-Identifier: LGPL-2.1-or-later
name: Initial CANCEL source-bound static build
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
concurrency:
  group: initial-cancel-static-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: "1"
  LLVM_CONFIG: /usr/bin/llvm-config-18
jobs:
  static-only:
    if: >-
      ${{ github.repository == 'Sleepywalker69/prospero-win' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            contains(github.event.pull_request.labels.*.name, 'build-initial-cancel-static'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Prepare recognized hosted compiler and evidence paths
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ccache clang-18 lld-18 llvm-18 llvm-18-dev bison flex gcc-mingw-w64 g++-mingw-w64 pkg-config m4 patch curl wget unzip zip xvfb xauth libx11-dev libxext-dev libfreetype-dev libfontconfig-dev libvulkan-dev libgnutls28-dev libasound2-dev libpulse-dev zlib1g-dev
          python3 -m pip install pyyaml==6.0.1
          mkdir -p "$RUNNER_TEMP/initial-cancel-evidence"
          printf '%s\n' \
            "PATH=/usr/lib/llvm-18/bin:$PATH" \
            "TITLE_FOUNDATION=$RUNNER_TEMP/title-foundation" \
            "FOUNDATION=$RUNNER_TEMP/prx-foundation" \
            "WINE_SOURCE=$RUNNER_TEMP/wine-source" \
            "PROSPERO_WINE_SOURCE=$RUNNER_TEMP/wine-source" \
            "PW_DISPATCH_CLANG=/usr/bin/clang-18" >> "$GITHUB_ENV"
      - name: Fetch exact recognized source inputs
        run: |
          set -euo pipefail
          {
            for selection in title prx; do
              if [[ $selection == title ]]; then
                destination=$TITLE_FOUNDATION
                pin=9c0b994a048521af6fb84c73ded364504fe250e9
              else
                destination=$FOUNDATION
                pin=30597512539e7edfde079cbcaf4a626bc0a948c5
              fi
              git init --quiet "$destination"
              git -C "$destination" remote add origin https://github.com/mpereiraesaa/ps5-native-app-boilerplate.git
              git -C "$destination" fetch --depth=1 origin "$pin"
              git -C "$destination" checkout --detach FETCH_HEAD
              [[ $(git -C "$destination" rev-parse HEAD) == "$pin" ]]
              git -C "$destination" archive HEAD | gzip -n > "$RUNNER_TEMP/initial-cancel-evidence/$selection-foundation-source.tar.gz"
            done
            pin=490f6d5dcbb2a5047345b8af88d114bbcaad69a8
            [[ $(sed -n 's/^WINE_COMMIT=//p' tools/build_wine_ps5.sh) == "$pin" ]]
            git init --quiet "$WINE_SOURCE"
            git -C "$WINE_SOURCE" remote add origin https://github.com/wine-mirror/wine.git
            git -C "$WINE_SOURCE" fetch --depth=1 origin "$pin"
            git -C "$WINE_SOURCE" checkout --detach FETCH_HEAD
            [[ $(git -C "$WINE_SOURCE" rev-parse HEAD) == "$pin" ]]
            git init --quiet "$RUNNER_TEMP/sdk-source"
            git -C "$RUNNER_TEMP/sdk-source" remote add origin https://github.com/ps5-payload-dev/sdk.git
            git -C "$RUNNER_TEMP/sdk-source" fetch --depth=1 origin 4eb701204fc3f8d31e84cf8ca272974e2be9c867
            git -C "$RUNNER_TEMP/sdk-source" checkout --detach FETCH_HEAD
            [[ $(git -C "$RUNNER_TEMP/sdk-source" rev-parse HEAD) == 4eb701204fc3f8d31e84cf8ca272974e2be9c867 ]]
            git -C "$RUNNER_TEMP/sdk-source" archive HEAD | gzip -n > "$RUNNER_TEMP/initial-cancel-evidence/sdk-source.tar.gz"
            git archive HEAD | gzip -n > "$RUNNER_TEMP/initial-cancel-evidence/project-source.tar.gz"
          } 2>&1 | tee "$RUNNER_TEMP/initial-cancel-evidence/source-inputs.log"
      - name: Run unchanged full host and sanitizer gates
        run: |
          set -euo pipefail
          make -j2 all 2>&1 | tee "$RUNNER_TEMP/initial-cancel-evidence/host-all.log"
          make sanitize 2>&1 | tee "$RUNNER_TEMP/initial-cancel-evidence/host-sanitize.log"
      - name: Prepare the pinned SDK, full CRT companion and converter dependency
        run: |
          set -euo pipefail
          {
            make -C "$TITLE_FOUNDATION" deps libc
            bash "$FOUNDATION/tools/setup-native-dependencies.sh"
            sdk="$TITLE_FOUNDATION/.deps/native/ps5-payload-sdk"
            python3 tools/tls_manifest.py select-llvm --sdk "$sdk"
            printf 'PS5_PAYLOAD_SDK=%s\n' "$sdk" >> "$GITHUB_ENV"
          } 2>&1 | tee "$RUNNER_TEMP/initial-cancel-evidence/dependencies.log"
      - name: Compile and statically verify the actual source-bound helper
        run: |
          set -euo pipefail
          python3 tools/build_owned_helper.py build --repo "$GITHUB_WORKSPACE" \
            --sdk "$PS5_PAYLOAD_SDK" --out "$RUNNER_TEMP/initial-cancel-helper" \
            2>&1 | tee "$RUNNER_TEMP/initial-cancel-evidence/helper-build.log"
          python3 tools/build_owned_helper.py verify --repo "$GITHUB_WORKSPACE" \
            --sdk "$PS5_PAYLOAD_SDK" --out "$RUNNER_TEMP/initial-cancel-helper" \
            > "$RUNNER_TEMP/initial-cancel-evidence/helper-admission.json"
      - name: Compile isolated full-CRT title using only the admitted real helper digest
        run: |
          set -euo pipefail
          python3 tools/build_initial_cancel.py build --repo "$GITHUB_WORKSPACE" \
            --sdk "$PS5_PAYLOAD_SDK" --foundation "$FOUNDATION" \
            --helper "$RUNNER_TEMP/initial-cancel-helper" --out "$RUNNER_TEMP/initial-cancel-title" \
            2>&1 | tee "$RUNNER_TEMP/initial-cancel-evidence/title-build.log"
          python3 tools/build_initial_cancel.py verify --repo "$GITHUB_WORKSPACE" \
            --sdk "$PS5_PAYLOAD_SDK" --foundation "$FOUNDATION" \
            --helper "$RUNNER_TEMP/initial-cancel-helper" --out "$RUNNER_TEMP/initial-cancel-title" \
            > "$RUNNER_TEMP/initial-cancel-evidence/title-static-admission.json"
      - name: Retain source/run identity and mandatory no-console status
        if: ${{ always() }}
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/initial-cancel-evidence"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          evidence = root / 'initial-cancel-evidence'
          files = {}
          for name in ('initial-cancel-helper', 'initial-cancel-title', 'initial-cancel-evidence'):
              for path in sorted((root / name).rglob('*')):
                  if path.is_file():
                      files[str(path.relative_to(root))] = {'bytes': path.stat().st_size,
                          'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
          record = {'schema': 'pw-initial-cancel-ci-evidence/1', 'source_head': os.environ['SOURCE_HEAD'],
                    'compiled_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'compiled_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                    'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'files': files, 'target_ready': False, 'no_reboot_lifecycle_verified': False,
                    'scope': 'Compile/link/static analysis only. No helper/title or console execution.'}
          (evidence / 'RUN-AND-FILES.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Preserve static-only evidence without release or console admission
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: initial-cancel-static-only-no-console-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/initial-cancel-evidence/
            ${{ runner.temp }}/initial-cancel-helper/
            ${{ runner.temp }}/initial-cancel-title/
          retention-days: 7
          if-no-files-found: error
